
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTX Mecatrônica — automação industrial (aula de Tailwind)</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
 <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mec: {
              bg:     '#1B2024', // fundo — grafite escuro
              panel:  '#242B30', // painel — um tom mais claro, pros cartões
              text:   '#E7EAEC', // texto claro sobre o fundo escuro
              amber:  '#E8B923', // amarelo de sinalização — cor de destaque
              blue:   '#5B87A0', // azul-aço — cor secundária
              line:   '#333B40', // bordas e divisores
              secondary: '#A2A7AB', // texto secundário, menos contraste
            }
          },
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            body: ['IBM Plex Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-mec-bg text-mec-text font-body antialiased">
    
    <header class="sticky top-0 z-50 bg-mec-bg/90 backdrop-blur border-b border-mec-line">
        <nav class="max-w-6xl mx-auto flex items-center justify-between px-6 py-4">
            <a href="#" class="font-display text-2xl font-bold">MTX
                <span class="text-mec-amber">Mecatrônica</span>
            </a>
            <ol id="menu-desktop" class="hidden md:flex gap-8 text-mec-text text-sm font-medium">
                <li><a href="#soluções" class="hover:text-mec-amber transition-colors">Soluções</a></li>
                <li><a href="#processos" class="hover:text-mec-amber transition-colors">Processos</a></li>
                <li><a href="#cliente" class="hover:text-mec-amber transition-colors">Cliente</a></li>
                <li><a href="#contato" class="bg-mec-amber text-mec-bg px-4 py-2 rounded-full font-semibold hover:bg-mec-text transition-colors">Pedir Orçamento</a></li>

            </ol>
            <button onclick="toggleMenu()" class="md:hidden p-2" aria-label="Abrir menu">

                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </nav>
    </header>

    <div class="columns-2 p-7 gap-4">
      <div class="aspect-1/2 ">
        <h2 class="text-4xl font-bold"> Mecanica, Eletrônica e<span class="text-mec-amber"> Software</span>, numa peça só.</h2>
        <h3 class="text-sm font-normal my-4 text-mec-secondary">Projetamos e integramos sistemas pra linhas de produção, do sensor ao painel de controle.</h3>
        <div class="flex gap-4">
          <a href="#contato" class="bg-mec-amber text-mec-bg px-2 py-2 rounded-3xl font-semibold hover:bg-mec-text transition-colors">Pedir Orçamento</a>
          <a href="#soluções" class=" text-mec-text px-2 py-2 rounded-3xl border border-mec-text font-semibold hover:border-mec-amber hover:text-mec-amber transition-colors">Ver Soluções</a>
        </div>
      </div>

</body>
